name: Refresh public evidence warehouse

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: knowledge-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check D1 warehouse sync configuration
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual warehouse refresh requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "D1 warehouse sync skipped: Cloudflare credentials are not configured."
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate refresh configuration
        run: npm run knowledge:refresh:validate

      - name: Refresh approved public sources
        run: npm run knowledge:refresh -- --config config/source-refresh.json

      - name: Refresh active domain source packs
        run: npm run knowledge:domain-refresh -- --config config/domain-source-refresh.json

      - name: Validate domain refresh report
        run: npm run knowledge:domain-refresh:validate

      - name: Materialize derived crime rates
        run: npm run knowledge:crime:rates

      - name: Validate the derived warehouse
        run: |
          npm run knowledge:warehouse
          npm run knowledge:freshness
          npm run knowledge:warehouse:sql
          npm run knowledge:coverage:validate:materialized
          npm run knowledge:coverage:audit
          npm run knowledge:coverage:audit:validate
          npm run knowledge:coverage:promote

      - name: Apply D1 migrations and load the warehouse
        if: steps.d1.outputs.configured == 'true'
        run: |
          npm run d1:migrate
          npm run knowledge:warehouse:d1

      - name: Upload refresh snapshot
        uses: actions/upload-artifact@v6
        with:
          name: evidence-warehouse-${{ github.run_id }}
          path: .local/source-warehouse
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage matrix
        uses: actions/upload-artifact@v6
        with:
          name: evidence-coverage-${{ github.run_id }}
          path: .local/coverage-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage audit
        uses: actions/upload-artifact@v6
        with:
          name: evidence-coverage-audit-${{ github.run_id }}
          path: .local/coverage-audit.*
          if-no-files-found: error
          retention-days: 14

      - name: Upload domain refresh report
        uses: actions/upload-artifact@v6
        with:
          name: domain-refresh-report-${{ github.run_id }}
          path: .local/domain-refresh-report.json
          if-no-files-found: error
          retention-days: 14

name: Maintain operational counters

on:
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

concurrency:
  group: operations-maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune-rate-limits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check maintenance configuration
        id: configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual maintenance requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled maintenance skipped: Cloudflare credentials are not configured."
          fi

      - name: Check out repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.configuration.outputs.configured == 'true'
        run: npm ci

      - name: Prune expired rate-limit windows
        if: steps.configuration.outputs.configured == 'true'
        run: |
          npx --no-install wrangler d1 execute elpaisestafatal-ops --remote --command "DELETE FROM api_rate_limits WHERE updated_at < datetime('now', '-2 days');"

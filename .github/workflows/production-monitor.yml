name: Monitor production clarification boundary

on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:

concurrency:
  group: production-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check live static and clarification boundaries
        env:
          SMOKE_ALLOW_OPERATIONAL_UNAVAILABLE: '1'
        run: npm run smoke:production

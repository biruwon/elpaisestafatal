name: Create operations backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

concurrency:
  group: operations-backup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WAREHOUSE_DATABASE_URL: ${{ secrets.WAREHOUSE_DATABASE_URL }}
    steps:
      - name: Check backup configuration
        id: configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual backup requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled backup skipped: Cloudflare backup credentials are not configured."
          fi

      - name: Check out repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.configuration.outputs.configured == 'true'
        run: npm ci

      - name: Export and verify operations state
        if: steps.configuration.outputs.configured == 'true'
        run: |
          set -euo pipefail
          backup_dir="$RUNNER_TEMP/elpaisestafatal-operations-backup"
          export BACKUP_DIR="$backup_dir"
          export BACKUP_REQUIRE_D1=1
          if [ -n "${WAREHOUSE_DATABASE_URL:-}" ]; then export BACKUP_REQUIRE_POSTGRES=1; fi
          npm run backup:operations
          npm run backup:artifact:validate

      - name: Upload verified operations backup
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elpaisestafatal-operations-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/elpaisestafatal-operations-backup
          if-no-files-found: error
          retention-days: 30

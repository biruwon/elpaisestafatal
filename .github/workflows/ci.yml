name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile the Pages runtime catalogue
        run: npm run catalogue:compile && npm run knowledge:runtime-catalogue && npm run catalogue:runtime:validate

      - name: Type and Astro checks
        run: npm run check

      - name: Validate local-runtime contract
        run: npm run container:validate

      - name: Validate Cloudflare deployment boundary
        run: npm run deployment:validate

      - name: Validate backup contract
        run: npm run backup:validate

      - name: Validate local-origin contract
        run: npm run origin:validate

      - name: Validate claim and knowledge contracts
        run: |
          npm run validate:content
          npm run knowledge:validate
          npm run knowledge:metrics
          npm run knowledge:refresh:validate
          npm run knowledge:handlers
          npm run knowledge:fallback-compiler
          npm run knowledge:discovery
          npm run knowledge:connectors
          npm run knowledge:freshness
          npm run knowledge:warehouse
          npm run knowledge:warehouse:query
          npm run knowledge:ranking
          npm run knowledge:warehouse:cache
          npm run knowledge:answer-plan
          npm run knowledge:evidence-packet
          npm run knowledge:materialization-candidates:validate
          npm run knowledge:promote-cluster:validate
          npm run knowledge:evaluate:metrics
          npm run knowledge:hybrid
          npm run knowledge:hybrid:corpus
          npm run knowledge:semantic-clustering
          npm run knowledge:coverage:audit
          npm run knowledge:coverage:audit:validate
          npm run knowledge:roadmap:status

      - name: Upload roadmap evidence artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: roadmap-evidence-${{ github.sha }}
          path: |
            .local/roadmap-status.json
            .local/coverage-audit.json
            .local/coverage-audit.md
          if-no-files-found: warn

      - name: Build public site and audit public surface
        run: |
          # Claim/knowledge contracts and release validation already ran
          # above. Keep this step focused on the static build and its
          # post-build public-surface checks so CI does not repeat the entire
          # release chain a second time.
          ./node_modules/.bin/astro build
          npm run knowledge:runtime-catalogue
          npm run claims:routing:validate
          npm run ux:static
          npm run knowledge:family-index
          npm run knowledge:family-collisions
          npm run audit:public-surface

      - name: Smoke-test the built Pages Functions boundary
        run: npm run smoke:pages

      - name: Validate request lifecycle and static fallback contracts
        run: |
          npm run input:validate
          npm run claim-input:lifecycle
          npm run ux:homepage
          npm run ux:data
          npm run ux:claims
          npm run ux:catalogue
          npm run ux:topics
          npm run ux:journeys
          npm run ux:navigation
          npm run ux:result
          npm run audit:roadmap

      - name: Smoke-test local text and media boundary without inference
        run: |
          # CI intentionally exercises the deterministic resolver contract. A
          # deliberately unreachable Ollama endpoint must not add model
          # timeout latency or make the smoke test depend on inference.
          OLLAMA_ENDPOINT=http://127.0.0.1:1 LOCAL_CLAIM_COMPILER=0 LOCAL_ANSWER_PLANNER=0 LOCAL_CLASSIFIER_PORT=8906 node scripts/local-claim-service.mjs > /tmp/local-claim-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8906/healthz > /dev/null; then break; fi
            sleep 0.25
          done
            SMOKE_RESOLVE_BASE_URL=http://127.0.0.1:8906 SMOKE_RESOLVE_PATH=/v1/classify npm run smoke:local-http

      - name: Check whitespace and repository state
        run: git diff --check

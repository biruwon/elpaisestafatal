name: Triage user claim demand

on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

concurrency:
  group: knowledge-triage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check triage configuration
        id: configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual triage requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled triage skipped: Cloudflare credentials are not configured."
          fi

      - name: Check out repository
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.configuration.outputs.configured == 'true'
        run: npm ci

      - name: Validate triage and export production claims
        if: steps.configuration.outputs.configured == 'true'
        run: |
          npm run knowledge:triage:validate
          npm run d1:migrate
          npm run knowledge:triage -- --export-d1 --sync-d1 --database elpaisestafatal-ops --min-count 3 --limit 50

      - name: Publish aggregate-only status
        if: steps.configuration.outputs.configured == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';

          const queue = JSON.parse(await readFile('.local/review-queue.json', 'utf8'));
          const summary = queue.summary || {};
          const report = [
            '# Claim demand triage',
            '',
            `- Scrubbed claim phrasings: ${Number(summary.submittedClaimPhrases) || 0}`,
            `- Submissions: ${Number(summary.submittedClaimEvents) || 0}`,
            `- Unclustered phrasings: ${Number(summary.unclusteredClaimPhrases) || 0}`,
            `- Research-only clusters: ${Number(summary.researchCandidates) || 0}`,
            '',
            'Claim wording stays in Cloudflare D1 and local review files. No claim text is attached to this public workflow run.',
            '',
            'To review locally, run `npm run knowledge:triage -- --export-d1 --database elpaisestafatal-ops --min-count 1 --limit 50`, then `npm run knowledge:review-dashboard`.',
          ].join('\n');

          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${report}\n`);
          NODE

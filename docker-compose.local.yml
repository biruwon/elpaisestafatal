services:
  claim-resolver:
    build:
      context: .
      dockerfile: Dockerfile.local
    environment:
      LOCAL_CLASSIFIER_PORT: 8789
      LOCAL_CLASSIFIER_BIND_HOST: 0.0.0.0
      LOCAL_CLASSIFIER_TOKEN: ${LOCAL_CLASSIFIER_TOKEN:-}
      OLLAMA_ENDPOINT: ${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
      OLLAMA_ROUTER_MODEL: ${OLLAMA_ROUTER_MODEL:-gemma4:26b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma4:26b}
      OLLAMA_KEEP_ALIVE_SECONDS: ${OLLAMA_KEEP_ALIVE_SECONDS:-600}
      LOCAL_SPEECH_COMMAND: ${LOCAL_SPEECH_COMMAND:-}
      LOCAL_SPEECH_ARGS: ${LOCAL_SPEECH_ARGS:-["{audio}"]}
      LOCAL_SPEECH_TIMEOUT_MS: ${LOCAL_SPEECH_TIMEOUT_MS:-45000}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8789:8789"
    volumes:
      - ./.local:/app/.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8789/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    environment:
      CLOUDFLARED_TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN before enabling the tunnel profile}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN before enabling the tunnel profile}
    depends_on:
      claim-resolver:
        condition: service_healthy
    restart: unless-stopped
